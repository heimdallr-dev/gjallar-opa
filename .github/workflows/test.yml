name: test
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  opa:
    runs-on: ubuntu-latest
    env: { OPA_VERSION: "1.4.2" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: OPA (checksum-verified)
        run: |
          base=https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}
          curl -sSfL -o opa "$base/opa_linux_amd64_static"
          echo "$(curl -sSfL "$base/opa_linux_amd64_static.sha256" | cut -d' ' -f1)  opa" | sha256sum -c -
          chmod +x opa && sudo mv opa /usr/local/bin/
      - run: opa fmt --fail -l policy && opa check --strict policy && opa test policy -v
      - name: Gatekeeper gator (checksum-verified)
        run: |
          f=gator-v3.23.1-linux-amd64.tar.gz
          curl -sSfLO "https://github.com/open-policy-agent/gatekeeper/releases/download/v3.23.1/$f"
          echo "c268d7b809c9fe59a110ab0bf7c296ab00b0b6c894c209cd15e94194590291bb  $f" | sha256sum -c -
          tar -xzf "$f" gator && ./gator verify gatekeeper -v
